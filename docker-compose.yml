services:
  panel:
    build: .
    container_name: neonpanel
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # tunnel profile — run with: docker compose --profile tunnel up
  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: neonpanel-tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      panel:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tunnel"]
